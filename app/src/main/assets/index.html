<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07111e">
<title>Multi Calculator</title>
<style>
:root{--bg:#07111c;--panel:#0d1927;--panel2:#132235;--key:#172536;--key2:#dce8f7;--text:#f5f8ff;--muted:#9db0c8;--blue:#1684ff;--line:#24364b;--green:#39e99a;--shadow:0 10px 30px #0005}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:radial-gradient(ellipse at top,#15283d 0,#07111c 60%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;padding-top: env(safe-area-inset-top);}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}

.app{width:100%;height:calc(100vh - env(safe-area-inset-top));max-width:100%;margin:0;padding:10px 8px 8px;display:flex;flex-direction:column;overflow:hidden}

.topbar{display:flex;align-items:center;justify-content:center;padding:8px 4px 12px;gap:8px;flex:none}
.top-actions{display:flex;gap:8px;width:100%;justify-content:space-between}
.ghost{background:linear-gradient(145deg, #1c2d42, #101e2e);border:1px solid #2d4561;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;flex:1;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,0.3);transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:0.3px;color:var(--text);min-height:44px}
.ghost:active{transform:scale(0.96);filter:brightness(1.2)}

#homePage{display:flex;flex-direction:column;flex:1;width:100%;height:calc(100vh - 65px - env(safe-area-inset-top));overflow:hidden}
.home-calculator{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;margin:0 !important;border-radius:20px;padding:12px;overflow:hidden}

.back-button{margin:0 0 14px}
main[hidden]{display:none!important}
#templatesPage{height:calc(100vh - 65px - env(safe-area-inset-top));overflow-y:auto;padding-bottom:70px}
#historyPage{height:calc(100vh - 65px - env(safe-area-inset-top));overflow-y:auto}
#toolPage{height:calc(100vh - 65px - env(safe-area-inset-top));overflow-y:auto}
#toolPage .tool-panel{max-width:760px;margin:0 auto}

.card{background:linear-gradient(145deg,#101d2c,#09131f);border:1px solid #2b4058;border-radius:20px;box-shadow:var(--shadow)}

.calculator{padding:12px;display:flex;flex-direction:column;height:100%}
.calc-head{display:none}

.calc-display{flex:1.2;min-height:120px;padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;border-bottom:1px solid var(--line);overflow:hidden}
.expression{color:#b8c8dc;font-size:19px;min-height:26px;overflow-wrap:anywhere;text-align:right;margin-bottom:4px}
.result{font-size:clamp(38px,8.5vw,56px);font-weight:600;letter-spacing:-1px;max-width:100%;overflow-wrap:anywhere;line-height:1.1}

.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;margin-top:10px;flex:2.2}
#keys{position:relative;isolation:isolate;overflow:hidden;border-radius:14px}
.key{width:100%;height:100%;border-radius:14px;background:linear-gradient(145deg,#1b2a3b,#121e2b);font-size:21px;font-weight:500;transition:transform .12s,filter .12s;box-shadow:inset 0 1px #ffffff09;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center}
.key:hover{filter:brightness(1.2)}.key:active{transform:scale(.95)}.key{border:1px solid transparent;position:relative;isolation:isolate;overflow:hidden}
.key-ripple{position:absolute;inset:1px;border:2px solid transparent;border-radius:inherit;pointer-events:none;z-index:8;opacity:0;box-shadow:0 0 0 0 transparent;transition:opacity .18s ease,box-shadow .55s ease,border-color .25s ease;will-change:opacity,box-shadow}
.tool-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tool-nav .ghost{display:inline-flex;align-items:center;gap:5px;flex:initial}
.key.op{background:linear-gradient(145deg,#0759ad,#07356c);color:#38a2ff}
.key.equal{background:linear-gradient(145deg,#248dff,#0871ef);color:white}
.key.zero{grid-column:span 2}

.light{--bg:#edf4fc;--panel:#fff;--panel2:#e4edf8;--text:#101a2b;--muted:#5f7088;--key:#e1ebf7;--key2:#dce8f7;--line:#cfdaea;--shadow:0 10px 28px #1e47701a;background:#eef4fb;color:var(--text)}
.light .ghost{background:linear-gradient(145deg, #ffffff, #eaf2fc);border-color:#c4d5ea;box-shadow:0 3px 10px rgba(0,0,0,0.06);color:#101a2b}
.light .card{background:linear-gradient(145deg,#fff,#f6f9ff);border-color:#d6e0ee}.light .key{background:linear-gradient(145deg,#e7eff9,#d9e5f4);color:#101a2b;box-shadow:inset 0 1px #fff}.light .key.op{background:#2388ff;color:#fff}.light .key.equal{background:#167dff;color:#fff}.light .expression{color:#4b607c}

.section{padding:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-size:17px}
.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;padding-bottom:50px}
.template{display:flex;align-items:center;text-align:left;gap:10px;padding:12px 10px;background:#111f2e;border:1px solid #24384e;border-radius:14px;min-width:0;transition:.15s}
.template:hover,.template.active{border-color:#218dff;background:#142c44}
.light .template{background:#f4f8fd;border-color:#d8e3f0}.light .template:hover,.light .template.active{background:#e6f2ff;border-color:#2388ff}
.ico{flex:none;width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2198ff,#0759d7);font-size:19px}
.template strong{display:block;font-size:12px;line-height:1.35}
.template small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.tool-panel{padding:20px;min-height:260px}
.tool-panel h2{margin:0 0 7px;font-size:21px}
.sub{margin:0 0 20px;color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px}
.field input,.field select{width:100%;min-width:0;background:#0a1522;color:var(--text);border:1px solid #31455d;border-radius:11px;padding:12px;font-size:15px;outline:none}
.light .field input,.light .field select{background:#fff;border-color:#cddaea}
.primary{background:linear-gradient(135deg,#238fff,#0872ee);padding:12px 16px;border-radius:11px;font-weight:650;margin-top:15px;width:100%}
.output{margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#0b1826;line-height:1.6;font-size:14px}
.light .output{background:#f4f8fd}
.output strong{font-size:18px;color:var(--green)}
.light .output strong{color:#078e61}
.list-item{display:flex;gap:10px;align-items:center;padding:11px;background:#101e2c;border:1px solid var(--line);border-radius:12px;text-align:left}
.light .list-item{background:#f5f8fd}
.notice{font-size:11px;color:var(--muted);margin-top:9px;line-line-height:1.5}

#banner-ad-slot{position:fixed;bottom:0;left:0;width:100%;z-index:9999;background:#0d1927;padding:6px;box-shadow:0 -4px 15px rgba(0,0,0,0.4);display:none}
#tool-banner-ad-slot{margin-top:18px;min-height:60px;text-align:center;display:none}

@media(max-width:520px){
  .app{padding:6px}
  .topbar .ghost{padding:10px 8px;font-size:13px;min-height:40px}
  .template-grid{grid-template-columns:1fr 1fr}
  .key{font-size:19px}
}

.menu-container{position:relative;display:inline-block;}
.dropdown-content{display:none;position:absolute;right:0;background-color:#132235;min-width:140px;box-shadow:0px 8px 16px rgba(0,0,0,0.3);z-index:100;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.dropdown-content a{color:var(--text);padding:10px 14px;text-decoration:none;display:block;font-size:13px;}
.dropdown-content a:hover{background-color:#1a2f4c;}
.light .dropdown-content{background-color:#fff;border-color:#cfdaea;}
.light .dropdown-content a:hover{background-color:#eef4fb;}
.show-menu{display:block;}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
 <div class="top-actions">
   <button class="ghost" id="historyBtn" aria-label="Calculation history">◷ History</button>
   <button class="ghost" id="themeBtn" aria-label="Toggle theme">☼ Theme</button>
   <button class="ghost" id="allBtn" aria-expanded="false">☷ Templates</button>
 </div>
</header>
<main id="homePage">
 <section class="card calculator home-calculator" aria-label="Calculator">
  <div class="calc-display"><div class="expression" id="expression"></div><div class="result" id="result">0</div></div>
  <div class="keys" id="keys">
   <button class="key" data-action="clear">C</button><button class="key" data-action="back">⌫</button><button class="key" data-value="%">%</button><button class="key op" data-value="÷">÷</button>
   <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="×">×</button>
   <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="−">−</button>
   <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-value="+">+</button>
   <button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equal" data-action="equal">=</button>
  </div>
 </section>
</main>
<main id="historyPage" hidden>
 <section class="card section">
  <div class="tool-nav">
    <button class="ghost" id="historyHome">⌂ Home</button>
    <button class="ghost" id="clearHistory">Clear Today</button>
    <button class="ghost" id="downloadHistory">📥 Download History</button>
  </div>
  <h2 class="section-title">Today's History <span id="historyDate" style="color:var(--muted);font-size:12px;font-weight:400"></span></h2>
  <div id="historyList"></div>
  <p class="notice">History is saved on this device and automatically resets when the date changes.</p>
 </section>
</main>
<main id="templatesPage" hidden>
 <section class="card section">
  <div class="tool-nav" style="display:flex; justify-content:space-between; align-items:center;">
    <button class="ghost" id="templatesHome">⌂ Home</button>
    <div class="menu-container">
      <button class="ghost" id="menuBtn" style="padding: 10px 14px; font-weight: bold;">⋮</button>
      <div id="dropdownMenu" class="dropdown-content">
        <a href="https://sites.google.com/view/privacy-policy-farazi-group/home" target="_blank">Privacy Policy</a>
      </div>
    </div>
  </div>
  <h2 class="section-title">Templates <span style="color:var(--muted);font-size:12px;font-weight:400">All calculators & converters</span></h2>
  <div class="template-grid" id="allList"></div>
  <div id="banner-ad-slot"></div>
 </section>
</main>
<main id="toolPage" hidden>
 <div class="tool-nav"><button class="ghost" id="backHome">⌂ Back to Home</button><button class="ghost" id="backTemplates">← Back to Templates</button></div>
 <section class="card tool-panel" id="toolPanel">
  <h2 id="toolTitle">BMI Calculator</h2><p class="sub" id="toolSub">Check your body mass index.</p>
  <div id="toolContent"></div>
  <div id="tool-banner-ad-slot"></div>
 </section>
</main>
</div>

<script>
document.getElementById('menuBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('dropdownMenu').classList.toggle('show-menu');
});
window.addEventListener('click', function() {
  const menu = document.getElementById('dropdownMenu');
  if (menu.classList.contains('show-menu')) {
    menu.classList.remove('show-menu');
  }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, collection, getDocs, getDoc, setDoc, updateDoc, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt-ZO4QU4q_0oNZxeCuFubgBTVkBwBDMc",
  authDomain: "farazi-advertising.firebaseapp.com",
  projectId: "farazi-advertising",
  storageBucket: "farazi-advertising.firebasestorage.app",
  messagingSenderId: "89663103201",
  appId: "1:89663103201:web:64e75e2cade189e7ce57a0",
  measurementId: "G-CFHXBGJ01X"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const APP_ID_STORAGE_KEY = 'farazi_advertising_app_id';
let CURRENT_APP_ID = localStorage.getItem(APP_ID_STORAGE_KEY);
if (!CURRENT_APP_ID) {
  CURRENT_APP_ID = doc(collection(db, 'registered_apps')).id;
  localStorage.setItem(APP_ID_STORAGE_KEY, CURRENT_APP_ID);
}
const CURRENT_APP_NAME = "Multi Calculator";
const CURRENT_APP_PACKAGE = "com.farazi.Multicalculator";
let appRegistrationPromise = null;

async function registerCurrentApp() {
  if (appRegistrationPromise) return appRegistrationPromise;
  appRegistrationPromise = (async () => {
    const appRef = doc(db, 'registered_apps', CURRENT_APP_ID);
    const existing = await getDoc(appRef);
    const now = Date.now();
    const registration = {
      appId: CURRENT_APP_ID,
      appName: CURRENT_APP_NAME,
      name: CURRENT_APP_NAME,
      packageName: CURRENT_APP_PACKAGE,
      platform: 'Android',
      status: 'active',
      lastSeenAt: now
    };
    if (!existing.exists()) {
      registration.createdAt = now;
      registration.totalImpressions = 0;
      registration.totalClicks = 0;
    }
    await setDoc(appRef, registration, { merge: true });
    return CURRENT_APP_ID;
  })().catch(err => {
    appRegistrationPromise = null;
    console.error('Farazi app registration failed:', err);
    throw err;
  });
  return appRegistrationPromise;
}

let activeAdId = null;
let activeAdUrl = "#";

async function loadTemplateBannerAd() {
 const slot = document.getElementById('banner-ad-slot'); if(!slot) return;
 try { 
   await registerCurrentApp(); 
   const snap = await getDocs(collection(db, 'ads')); 
   const list = [];
   snap.forEach(d => {
     const a = d.data(); 
     if(a.type === 'Banner' && (a.targetApp === 'All Apps' || a.targetApp === CURRENT_APP_ID)) {
       list.push({ id: d.id, ...a });
     }
   });
   
   if(!list.length) {
     slot.innerHTML = '<p style="color:#9ca3af;font-size:11px;text-align:center">No banner ad available.</p>';
     slot.style.display = 'block';
     return;
   }
   
   const ad = list[Math.floor(Math.random() * list.length)]; 
   activeAdId = ad.id; 
   activeAdUrl = ad.targetLink || '#';
   
   const title = String(ad.title || 'Sponsored').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
   const mediaUrl = String(ad.imageUrl || '').replace(/"/g, '&quot;');
   
   slot.style.display = 'block'; 
   let mediaContent = mediaUrl ? `<img src="${mediaUrl}" alt="Sponsored" style="width:100%;max-height:60px;object-fit:cover;border-radius:4px;display:block;margin:0 auto;">` : '';

   slot.innerHTML = `
     <div id="custom-banner-card-banner-ad-slot" style="background:#182032;padding:4px;border-radius:8px;position:relative;border:1px solid #2b4562">
       <button aria-label="Close ad" onclick="document.getElementById('banner-ad-slot').style.display='none'" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;z-index:10;font-size:11px;display:grid;place-items:center;">&times;</button>
       <div onclick="window.clickCustomBannerAd()" style="cursor:pointer;text-align:center">
         ${mediaContent}
         <p style="color:white;font-size:10px;margin:2px 0 0;font-weight:bold">${title}</p>
       </div>
     </div>
   `;
   
   const batch = writeBatch(db); 
   batch.update(doc(db, 'ads', activeAdId), { impressions: increment(1) }); 
   batch.update(doc(db, 'registered_apps', CURRENT_APP_ID), { totalImpressions: increment(1), lastSeenAt: Date.now() }); 
   await batch.commit();
 } catch(err) {
   console.error('Farazi banner ad load error:', err);
   slot.innerHTML = '<p style="color:#9ca3af;font-size:11px;text-align:center">Ad unavailable.</p>';
   slot.style.display = 'block';
 }
}

async function loadToolVideoPhotoAd() {
 const slot = document.getElementById('tool-banner-ad-slot'); if(!slot) return;
 try { 
   await registerCurrentApp(); 
   const snap = await getDocs(collection(db, 'ads')); 
   const list = [];
   snap.forEach(d => {
     const a = d.data(); 
     if(['Video', 'Photo', 'Image'].includes(a.type) && (a.targetApp === 'All Apps' || a.targetApp === CURRENT_APP_ID)) {
       list.push({ id: d.id, ...a });
     }
   });
   
   if(!list.length) {
     slot.innerHTML = '<p style="color:#9ca3af;font-size:11px;text-align:center">No video/photo ad available.</p>';
     slot.style.display = 'block';
     return;
   }
   
   const ad = list[Math.floor(Math.random() * list.length)]; 
   activeAdId = ad.id; 
   activeAdUrl = ad.targetLink || '#';
   
   const title = String(ad.title || 'Sponsored').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
   const mediaUrl = String(ad.imageUrl || '').replace(/"/g, '&quot;');
   const type = String(ad.type || '').toLowerCase();
   
   slot.style.display = 'block'; 
   
   let mediaContent = '';
   if(type === 'video' || mediaUrl.endsWith('.mp4') || mediaUrl.endsWith('.webm')) {
     mediaContent = `<video src="${mediaUrl}" controls autoplay muted playsinline style="width:100%;height:auto;max-height:450px;border-radius:8px;background:#000;display:block;margin:0 auto;"></video>`;
   } else if(mediaUrl) {
     mediaContent = `<img src="${mediaUrl}" alt="Sponsored" style="width:100%;height:auto;max-height:450px;object-fit:contain;border-radius:8px;display:block;margin:0 auto;">`;
   }

   slot.innerHTML = `
     <div id="custom-banner-card-tool-banner-ad-slot" style="background:#182032;padding:10px;border-radius:12px;position:relative;border:1px solid #2b4562">
       <button aria-label="Close ad" onclick="document.getElementById('tool-banner-ad-slot').style.display='none'" style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;z-index:10;font-size:14px;display:grid;place-items:center;">&times;</button>
       <div onclick="window.clickCustomBannerAd()" style="cursor:pointer;text-align:center">
         ${mediaContent}
         <p style="color:white;font-size:12px;margin:8px 0 0;font-weight:bold">${title}</p>
       </div>
     </div>
   `;
   
   const batch = writeBatch(db); 
   batch.update(doc(db, 'ads', activeAdId), { impressions: increment(1) }); 
   batch.update(doc(db, 'registered_apps', CURRENT_APP_ID), { totalImpressions: increment(1), lastSeenAt: Date.now() }); 
   await batch.commit();
 } catch(err) {
   console.error('Farazi tool ad load error:', err);
   slot.innerHTML = '<p style="color:#9ca3af;font-size:11px;text-align:center">Ad unavailable.</p>';
   slot.style.display = 'block';
 }
}

window.clickCustomBannerAd = async function() {
  if (activeAdId) {
    try {
      const batch = writeBatch(db);
      batch.update(doc(db, 'ads', activeAdId), { clicks: increment(1) });
      batch.update(doc(db, 'registered_apps', CURRENT_APP_ID), { totalClicks: increment(1), lastSeenAt: Date.now() });
      await batch.commit();
    } catch(err) {
      console.warn('Click count update failed', err);
    }
    if (activeAdUrl && activeAdUrl !== "#") {
      window.open(activeAdUrl, '_blank');
    }
  }
}

let lastBannerLoadAt = 0;
window.loadTemplateBanner = function() {
  const now = Date.now();
  if (now - lastBannerLoadAt < 800) return;
  lastBannerLoadAt = now;
  loadTemplateBannerAd();
};

window.loadToolBanner = function() {
  loadToolVideoPhotoAd();
};
</script>

const HISTORY_KEY='multiCalcDailyHistory';
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getHistory(){let h;try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'null')}catch{};if(!h||h.date!==todayKey())h={date:todayKey(),items:[]};localStorage.setItem(HISTORY_KEY,JSON.stringify(h));return h;}

document.getElementById('downloadHistory').onclick = () => {
  const h = getHistory();
  if (!h.items || !h.items.length) {
    alert('No calculation history available to download today.');
    return;
  }
  let fileContent = `Multi Calculator History - ${h.date}\n===============================\n\n`;
  h.items.forEach((item, idx) => {
    fileContent += `${idx + 1}. [${item.time}] ${item.expression} = ${item.result}\n`;
  });
  const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });

function playKeyRipple(clicked){
  const keys=[...$('keys').querySelectorAll('.key')];
  const a=clicked.getBoundingClientRect(), cx=a.left+a.width/2, cy=a.top+a.height/2;
  const unit=Math.max(a.width,a.height);
  keys.forEach((k)=>{
    const r=k.getBoundingClientRect();
    const d=Math.hypot((r.left+r.width/2)-cx,(r.top+r.height/2)-cy);
    const hue=(190+d*1.15)%360;
    const wave=document.createElement('span');
    wave.className='key-ripple';
    wave.style.borderColor=`hsl(${hue},100%,68%)`;
    k.appendChild(wave);
    const delay=Math.round(d/unit*129);
    setTimeout(()=>{
      if(!wave.isConnected)return;
      wave.style.opacity='1';
      wave.style.boxShadow=`0 0 8px 2px hsla(${hue},100%,65%,.62)`;
      setTimeout(()=>{
        if(!wave.isConnected)return;
        wave.style.opacity='0';
        wave.style.boxShadow=`0 0 0 0 hsla(${hue},100%,65%,0)`;
        setTimeout(()=>wave.remove(),600);
      },350);
    },delay);
  });
}

});

case'percent':r=`${num('p')}% of ${num('n')}<br><strong>${(num('p')*num('n')/100).toLocaleString()}</strong>`;break;
case'currency':{const rates=window.currencyRates||{USD:1,BDT:122,EUR:.92,GBP:.78,INR:83.5};const from=$('from').value,to=$('to').value;if(!rates[from]||!rates[to])throw Error('Rate not available.');let v=num('amount')/rates[from]*rates[to];r=`Converted amount<br><strong>${v.toLocaleString(undefined,{maximumFractionDigits:4})} ${to}</strong>`;break}
case'unit':case'length':case'weight':case'volume':case'temp':case'speed':{let v=num('val'),a=$('from').value,b=$('to').value,cat=id==='unit'?$('category').value:id;const factors={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254},weight:{kg:1,g:.001,mg:1e-6,lb:.45359237,oz:.028349523125,t:1000},volume:{l:1,ml:.001,m3:1000,cm3:.001,gal:3.785411784,qt:.946352946,cup:.2365882365},speed:{ms:1,kmh:1/3.6,mph:.44704,fts:.3048,knot:.514444}};let z;if(cat==='temp'){let c=a==='f'?(v-32)*5/9:a==='k'?v-273.15:v;z=b==='f'?c*9/5+32:b==='k'?c+273.15:c;}else{if(!(a in factors[cat])||!(b in factors[cat]))throw Error('Select units from same category.');z=v*factors[cat][a]/factors[cat][b]}const labels={m:'m',km:'km',cm:'cm',mm:'mm',mi:'mi',yd:'yd',ft:'ft',in:'in',kg:'kg',g:'g',mg:'mg',lb:'lb',oz:'oz',t:'t',l:'L',ml:'mL',m3:'m³',cm3:'cm³',gal:'US gal',qt:'US qt',cup:'US cup',c:'°C',f:'°F',k:'K',ms:'m/s',kmh:'km/h',mph:'mph',fts:'ft/s',knot:'kn'};r=`Converted value<br><strong>${z.toLocaleString(undefined,{maximumFractionDigits:8})}</strong> ${labels[b]}`;break}
case'discount':{let p=num('price'),d=num('discount');r=`Final price<br><strong>${(p*(1-d/100)).toFixed(2)}</strong><br>You save ${(p*d/100).toFixed(2)}`;break}
case'bmr':case'calorie':{let age=num('age'),w=num('weight'),h=num('height'),s=$('sex').value==='male'?5:-161,bmr=10*w+6.25*h-5*age+s;r=`Estimated daily calories<br><strong>${Math.round(id==='bmr'?bmr:bmr*1.45)} kcal</strong>`;break}
case'water':r=`Daily water estimate<br><strong>${(num('weight')*.035).toFixed(2)} liters</strong>`;break;
case'date':{let days=Math.abs(new Date($('end').value)-new Date($('start').value))/86400000;r=`Date difference<br><strong>${Math.round(days)} days</strong>`;break}
case'time':{let m=num('hours')*60+num('minutes');r=`Total duration<br><strong>${Math.floor(m/60)}h ${m%60}m</strong>`;break}
case'gpa':{
  const gps=[...document.querySelectorAll('.gp')].map(x=>Number(x.value)),
        crs=[...document.querySelectorAll('.cr')].map(x=>Number(x.value));
  if(!gps.length||gps.some(x=>x<0||x>5)||crs.some(x=>!Number.isFinite(x)||x<=0))
    throw Error('Each grade point must be 0–5 and each credit must be greater than 0.');
  const total=crs.reduce((a,b)=>a+b,0),
        points=gps.reduce((sum,g,i)=>sum+g*crs[i],0),
        gpa=points/total;
  r=`Your GPA<br><strong>${gpa.toFixed(2)} / 5.00</strong><br>Total subjects: ${gps.length}<br>Total credits: ${total.toFixed(1)}<br>Total weighted grade points: ${points.toFixed(2)}`;
  break;
}
case'tax':{let p=num('price'),t=num('tax');r=`Price with tax<br><strong>${(p*(1+t/100)).toFixed(2)}</strong>`;break}
case'savings':{let d=num('deposit'),n=num('years')*12,rate=num('rate')/1200,total=rate?d*(Math.pow(1+rate,n)-1)/rate:d*n;r=`Estimated savings<br><strong>${total.toLocaleString(undefined,{maximumFractionDigits:2})}</strong>`;break}
case'fuel':{let l=num('distance')*num('consumption')/100;r=`Estimated fuel cost<br><strong>${(l*num('fuelprice')).toFixed(2)}</strong>`;break}
case'ratio':{let a=num('a'),b=num('b'),g=(x,y)=>y?g(y,x%y):Math.abs(x);let d=g(a,b)||1;r=`Simplified ratio<br><strong>${a/d} : ${b/d}</strong>`;break}
case'average':{let arr=$('numbers').value.split(',').map(Number);if(!arr.length||arr.some(x=>!Number.isFinite(x)))throw Error('Enter comma-separated numbers.');r=`Average<br><strong>${(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(3)}</strong>`;break}
case'area':r=`Rectangle area<br><strong>${(num('length')*num('width')).toLocaleString()} square units</strong>`;break;
case'electricity':r=`Estimated electricity cost<br><strong>${(num('usage')*num('rate')).toFixed(2)}</strong>`;break;
default:r=`Result<br><strong>${(num('n')+num('m')).toLocaleString()}</strong>`;
}output(r)}catch(e){output(`<span style="color:#ff7a7a">${e.message||'Please check your input.'}</span>`)}}

async function loadCryptoMarketData(){
 const status=$('cryptoStatus'); if(!status) return;
 try {
   const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=false', {cache:'no-store'});
   if(!res.ok) throw Error('Market data unavailable');
   const data = await res.json();
   window.cryptoMarketData = data;
   populateCryptoSelect(data);
   status.textContent = `Live market data loaded successfully (${data.length} coins).`;
 } catch(e) {
   window.cryptoMarketData = [
     {id:'bitcoin', symbol:'btc', name:'Bitcoin', current_price:65000, price_change_percentage_24h:2.5},
     {id:'ethereum', symbol:'eth', name:'Ethereum', current_price:3500, price_change_percentage_24h:1.2},
     {id:'solana', symbol:'sol', name:'Solana', current_price:150, price_change_percentage_24h:4.8}
   ];
   populateCryptoSelect(window.cryptoMarketData);
   status.textContent = 'Using cached offline crypto values.';
 }
}

function populateCryptoSelect(list){
 const sel = $('cryptoCoinSelect');
 if(!sel) return;
 sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name} (${c.symbol.toUpperCase()}) - $${c.current_price.toLocaleString()}</option>`).join('');
 
 const filterInput = $('cryptoSearchFilter');
 if(filterInput){
   filterInput.oninput = (e) => {
     const term = e.target.value.toLowerCase().trim();
     const filtered = list.filter(c => c.name.toLowerCase().includes(term) || c.symbol.toLowerCase().includes(term));
     sel.innerHTML = filtered.map(c => `<option value="${c.id}">${c.name} (${c.symbol.toUpperCase()}) - $${c.current_price.toLocaleString()}</option>`).join('');
   };
 }
}

async function loadCurrencyRates(){
 const status=$('rateStatus');if(!status)return;const today=new Date().toISOString().slice(0,10);let cached=null;try{cached=JSON.parse(localStorage.getItem('multiCalcCurrencyRates')||'null')}catch{}
 if(cached?.date===today&&cached?.rates){window.currencyRates=cached.rates;window.currencyRateDate=cached.date;status.textContent=`Rates updated online: ${cached.date}`;return}
 try{const response=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});if(!response.ok)throw Error('Rate service unavailable');const data=await response.json();if(data.result!=='success'||!data.rates)throw Error('Invalid rate response');window.currencyRates=data.rates;window.currencyRateDate=new Date().toISOString().slice(0,10);localStorage.setItem('multiCalcCurrencyRates',JSON.stringify({date:today,rates:data.rates}));status.textContent=`Online rates loaded.`;
 }catch(e){if(!window.currencyRates)window.currencyRates={USD:1,BDT:122,EUR:.92,GBP:.78,INR:83.5};status.textContent=`Using offline fallback rates.`}
}

showPage('home');
</script>
