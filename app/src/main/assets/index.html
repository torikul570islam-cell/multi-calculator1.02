<style>
:root{--bg:#07111c;--panel:#0d1927;--panel2:#132235;--key:#172536;--key2:#dce8f7;--text:#f5f8ff;--muted:#9db0c8;--blue:#1684ff;--line:#24364b;--green:#39e99a;--shadow:0 10px 30px #0005}

button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}
.app{max-width:1180px;margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 20px;gap:12px}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:750;letter-spacing:.2px}.brand-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#2296ff,#0758dc);display:grid;place-items:center;font-size:24px;box-shadow:0 5px 20px #087dff55}.top-actions{display:flex;gap:8px}.ghost{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 13px}.layout{display:grid;grid-template-columns:minmax(290px,390px) 1fr;gap:18px;align-items:start}.home-calculator{max-width:560px;width:100%;margin:4px auto 0}.back-button{margin:0 0 14px}main[hidden]{display:none!important}#templatesPage .section{margin-top:10px}#toolPage .tool-panel{max-width:760px;margin:0 auto}.card{background:linear-gradient(145deg,#101d2c,#09131f);border:1px solid #2b4058;border-radius:23px;box-shadow:var(--shadow);overflow:hidden}.calculator{padding:17px}.calc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.calc-head h2{font-size:16px;margin:0;font-weight:650}.calc-display{min-height:190px;padding:20px 14px 24px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;border-bottom:1px solid var(--line);overflow:hidden}.expression{color:#b8c8dc;font-size:18px;min-height:28px;overflow-wrap:anywhere;text-align:right}.result{font-size:clamp(38px,7vw,50px);font-weight:500;letter-spacing:-1px;max-width:100%;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}#keys{position:relative;isolation:isolate;overflow:hidden;border-radius:15px}.key{height:82px;border-radius:14px;background:linear-gradient(145deg,#1b2a3b,#121e2b);font-size:24px;transition:transform .12s,filter .12s;box-shadow:inset 0 1px #ffffff09;position:relative;isolation:isolate;overflow:hidden}.key:hover{filter:brightness(1.2)}.key:active{transform:scale(.96)}.key{border:1px solid transparent;position:relative;isolation:isolate;overflow:hidden}
.key-ripple{position:absolute;inset:1px;border:2px solid transparent;border-radius:inherit;pointer-events:none;z-index:8;opacity:0;box-shadow:0 0 0 0 transparent;transition:opacity .18s ease,box-shadow .55s ease,border-color .25s ease;will-change:opacity,box-shadow}
.tool-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.tool-nav .ghost{display:inline-flex;align-items:center;gap:5px}.key.op{background:linear-gradient(145deg,#0759ad,#07356c);color:#38a2ff}.key.equal{background:linear-gradient(145deg,#248dff,#0871ef);color:white}.key.zero{grid-column:span 2}.light{--bg:#edf4fc;--panel:#fff;--panel2:#e4edf8;--text:#101a2b;--muted:#5f7088;--key:#e1ebf7;--key2:#dce8f7;--line:#cfdaea;--shadow:0 10px 28px #1e47701a;background:#eef4fb;color:var(--text)}.light .card{background:linear-gradient(145deg,#fff,#f6f9ff);border-color:#d6e0ee}.light .key{background:linear-gradient(145deg,#e7eff9,#d9e5f4);color:#101a2b;box-shadow:inset 0 1px #fff}.light .key.op{background:#2388ff;color:#fff}.light .key.equal{background:#167dff;color:#fff}.light .expression{color:#4b607c}
.content{display:grid;gap:18px}.section{padding:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-size:17px}.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.template{display:flex;align-items:center;text-align:left;gap:10px;padding:12px 10px;background:#111f2e;border:1px solid #24384e;border-radius:14px;min-width:0;transition:.15s}.template:hover,.template.active{border-color:#218dff;background:#142c44}.light .template{background:#f4f8fd;border-color:#d8e3f0}.light .template:hover,.light .template.active{background:#e6f2ff;border-color:#2388ff}.ico{flex:none;width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#2198ff,#0759d7);font-size:19px}.template strong{display:block;font-size:12px;line-height:1.35}.template small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.tool-panel{padding:20px;min-height:260px}.tool-panel h2{margin:0 0 7px;font-size:21px}.sub{margin:0 0 20px;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px}.field input,.field select{width:100%;min-width:0;background:#0a1522;color:var(--text);border:1px solid #31455d;border-radius:11px;padding:12px;font-size:15px;outline:none}.light .field input,.light .field select{background:#fff;border-color:#cddaea}.primary{background:linear-gradient(135deg,#238fff,#0872ee);padding:12px 16px;border-radius:11px;font-weight:650;margin-top:15px;width:100%}.output{margin-top:15px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#0b1826;line-height:1.6}.light .output{background:#f4f8fd}.output strong{font-size:25px;color:var(--green)}.light .output strong{color:#078e61}.full{grid-column:1/-1}.templates-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.templates-drawer{margin-bottom:18px}.templates-drawer[hidden]{display:none}.list-item{display:flex;gap:10px;align-items:center;padding:11px;background:#101e2c;border:1px solid var(--line);border-radius:12px;text-align:left}.light .list-item{background:#f5f8fd}.list-item span:last-child{font-size:13px}.list-item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature{padding:13px;text-align:center;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px}.feature b{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.foot{text-align:center;color:var(--muted);font-size:12px;padding:22px 0 5px}.notice{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5}
@media(max-width:850px){.layout{grid-template-columns:1fr}.calculator{max-width:560px;width:100%;margin:auto}.template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{grid-row:2}.templates-list{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.app{padding:10px}.topbar{padding:8px 2px 15px}.brand{font-size:17px}.brand-icon{width:36px;height:36px}.ghost{padding:9px 10px}.calculator{padding:15px;border-radius:20px}.key{height:76px}.template-grid{grid-template-columns:1fr 1fr}.template{padding:9px 7px;gap:7px}.ico{width:32px;height:32px;font-size:16px}.template strong{font-size:11px}.section,.tool-panel{padding:14px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.templates-list{grid-template-columns:1fr}.features{grid-template-columns:1fr}.result{font-size:42px}}

/* 3-Dot Dropdown Menu Styling */
.menu-container{position:relative;display:inline-block;}
.dropdown-content{display:none;position:absolute;right:0;background-color:#132235;min-width:140px;box-shadow:0px 8px 16px rgba(0,0,0,0.3);z-index:100;border:1px solid var(--line);border-radius:10px;overflow:hidden;}

.dropdown-content a:hover{background-color:#1a2f4c;}

</style>

<script>
document.getElementById('menuBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  document.getElementById('dropdownMenu').classList.toggle('show-menu');
});
window.addEventListener('click', function() {
  const menu = document.getElementById('dropdownMenu');
  if (menu.classList.contains('show-menu')) {
    menu.classList.remove('show-menu');
  }
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, collection, getDocs, getDoc, setDoc, updateDoc, increment, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDt-ZO4QU4q_0oNZxeCuFubgBTVkBwBDMc",
  authDomain: "farazi-advertising.firebaseapp.com",
  projectId: "farazi-advertising",
  storageBucket: "farazi-advertising.firebasestorage.app",
  messagingSenderId: "89663103201",
  appId: "1:89663103201:web:64e75e2cade189e7ce57a0",
  measurementId: "G-CFHXBGJ01X"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const APP_ID_STORAGE_KEY = 'farazi_advertising_app_id';
let CURRENT_APP_ID = localStorage.getItem(APP_ID_STORAGE_KEY);
if (!CURRENT_APP_ID) {
  CURRENT_APP_ID = doc(collection(db, 'registered_apps')).id;
  localStorage.setItem(APP_ID_STORAGE_KEY, CURRENT_APP_ID);
}
const CURRENT_APP_NAME = "Multi Calculator";
const CURRENT_APP_PACKAGE = "com.farazi.Multicalculator";
let appRegistrationPromise = null;

async function registerCurrentApp() {
  if (appRegistrationPromise) return appRegistrationPromise;
  appRegistrationPromise = (async () => {
    const appRef = doc(db, 'registered_apps', CURRENT_APP_ID);
    const existing = await getDoc(appRef);
    const now = Date.now();
    const registration = {
      appId: CURRENT_APP_ID,
      appName: CURRENT_APP_NAME,
      name: CURRENT_APP_NAME,
      packageName: CURRENT_APP_PACKAGE,
      platform: 'Android',
      status: 'active',
      lastSeenAt: now
    };
    if (!existing.exists()) {
      registration.createdAt = now;
      registration.totalImpressions = 0;
      registration.totalClicks = 0;
    }
    await setDoc(appRef, registration, { merge: true });
    return CURRENT_APP_ID;
  })().catch(err => {
    appRegistrationPromise = null;
    console.error('Farazi app registration failed:', err);
    throw err;
  });
  return appRegistrationPromise;
}

let activeAdId = null;
let activeAdUrl = "#";

async function loadBannerAd(slotId) {
 const slot = document.getElementById(slotId); if(!slot) return;
 try { 
   await registerCurrentApp(); 
   const snap = await getDocs(collection(db, 'ads')); 
   const list = [];
   snap.forEach(d => {
     const a = d.data(); 
     if(['Banner','Image','Photo'].includes(a.type) && (a.targetApp === 'All Apps' || a.targetApp === CURRENT_APP_ID)) {
       list.push({ id: d.id, ...a });
     }
   });
   
   if(!list.length) {
     slot.innerHTML = '<p style="color:#9ca3af;font-size:11px">No sponsored ad available.</p>';
     return;
   }
   
   const ad = list[Math.floor(Math.random() * list.length)]; 
   activeAdId = ad.id; 
   activeAdUrl = ad.targetLink || '#';
   
   const title = String(ad.title || 'Sponsored').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
   const img = String(ad.imageUrl || '').replace(/"/g, '&quot;');
   
   slot.style.display = 'block'; 
   slot.innerHTML = `
     <div id="custom-banner-card-${slotId}" style="background:#182032;padding:8px;border-radius:10px;position:relative;border:1px solid #2b4562">
       <button aria-label="Close ad" onclick="document.getElementById('custom-banner-card-${slotId}').style.display='none'" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:white;border:none;border-radius:50%;width:20px;height:20px">&times;</button>
       <div onclick="window.clickCustomBannerAd()" style="cursor:pointer;text-align:center">
         ${img ? `<img src="${img}" alt="Sponsored" style="width:100%;height:75px;object-fit:cover;border-radius:6px">` : ''}
         <p style="color:white;font-size:10px;margin:4px 0 0;font-weight:bold">${title}</p>
       </div>
     </div>
   `;
   
   const batch = writeBatch(db); 
   batch.update(doc(db, 'ads', activeAdId), { impressions: increment(1) }); 
   batch.update(doc(db, 'registered_apps', CURRENT_APP_ID), { totalImpressions: increment(1), lastSeenAt: Date.now() }); 
   await batch.commit();
 } catch(err) {
   console.error('Farazi banner ad load error:', err);
   slot.innerHTML = '<p style="color:#9ca3af;font-size:11px">Ad unavailable.</p>';
 }
}

window.clickCustomBannerAd = async function() {
  if (activeAdId) {
    try {
      const batch = writeBatch(db);
      batch.update(doc(db, 'ads', activeAdId), { clicks: increment(1) });
      batch.update(doc(db, 'registered_apps', CURRENT_APP_ID), { totalClicks: increment(1), lastSeenAt: Date.now() });
      await batch.commit();
    } catch(err) {
      console.warn('Click count update failed', err);
    }
    if (activeAdUrl && activeAdUrl !== "#") {
      window.open(activeAdUrl, '_blank');
    }
  }
}

let lastBannerLoadAt = 0;
window.loadTemplateBanner = function() {
  const now = Date.now();
  if (now - lastBannerLoadAt < 800) return;
  lastBannerLoadAt = now;
  loadBannerAd('banner-ad-slot');
};

window.loadToolBanner = function() {
  loadBannerAd('tool-banner-ad-slot');
};
</script>

<script>
const tools=[
['BMI Calculator','⚖️','Check your body mass index','bmi'],['Age Calculator','🎂','Find your exact age','age'],['Loan Calculator','🏦','Calculate monthly payment','loan'],['EMI Calculator','▦','EMI and total amount','emi'],['Percentage Calculator','％','Find percentage value','percent'],['Currency Converter','💱','Convert currencies with daily online rates','currency'],['Time Zone','🌐','Current world times and difference from Bangladesh','timezone'],['Unit Converter','⇄','Choose a measurement category','unit'],['Discount Calculator','🏷️','Calculate discount price','discount'],['BMR Calculator','🔥','Estimate basal metabolic rate','bmr'],['Water Intake','💧','Estimate daily water needs','water'],['Calorie Calculator','🍎','Estimate daily calories','calorie'],['Date Calculator','📅','Calculate date differences','date'],['Time Calculator','◷','Calculate time durations','time'],['Sales Tax Calculator','🧾','Add sales tax to a price','tax'],['Savings Calculator','💰','Estimate savings growth','savings'],['Fuel Cost Calculator','⛽','Estimate trip fuel costs','fuel'],['GPA Calculator','📘','Calculate GPA from subject grades','gpa'],['Ratio Calculator','⚖','Simplify a ratio','ratio'],['Average Calculator','∑','Find the average','average'],['Length Converter','↔','Convert length units','length'],['Weight Converter','⚖','Convert mass/weight units','weight'],['Temperature Converter','🌡️','Convert temperature units','temp'],['Volume Converter','🧪','Convert volume units','volume'],['Speed Converter','🚀','Convert speed units','speed'],['Area Calculator','▧','Calculate rectangle area','area'],['Electricity Cost','⚡','Estimate electricity bill','electricity']
];
const $=id=>document.getElementById(id); let expression='',done=false;

function safeCalc(s){if(!s.trim())return 0;s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[\d+\-*/().\%\s]+$/.test(s))throw Error('Invalid expression');return Function('"use strict";return ('+s+')')()}
function showCalc(){ $('expression').textContent=expression;try{$('result').textContent=expression?String(Number(safeCalc(expression).toPrecision(10))):'0'}catch{$('result').textContent='…'}}
$('keys').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset.action,v=b.dataset.value;if(a==='clear'){expression='';done=false}else if(a==='back'){expression=expression.slice(0,-1);done=false}else if(a==='equal'){try{let original=expression;let n=safeCalc(expression);$('expression').textContent=original+' =';expression=String(Number(n.toPrecision(10)));$('result').textContent=expression;addHistory(original,expression);done=true;return}catch{$('result').textContent='Error';return}}else{if(done&&/[0-9.]/.test(v)){expression=''}done=false;expression+=v}showCalc()});
document.addEventListener('keydown',e=>{if($('homePage').hidden)return;if(/^[0-9.+\-*/()%]$/.test(e.key)){expression+=e.key.replace('*','×').replace('/','÷');showCalc()}else if(e.key==='Enter'){try{let original=expression;let n=safeCalc(expression);$('expression').textContent=original+' =';expression=String(Number(n.toPrecision(10)));$('result').textContent=expression;addHistory(original,expression);done=true}catch{$('result').textContent='Error'}}else if(e.key==='Backspace'){expression=expression.slice(0,-1);showCalc()}else if(e.key==='Escape'){expression='';showCalc()}});
function iconColor(i){return ['#1688ff','#8c68ff','#17b88b','#11b9c7','#efaa22','#ff784d'][i%6]}
function makeTool(t,i,cls='template'){let b=document.createElement('button');b.className=cls;b.innerHTML=`<span class="ico" style="background:linear-gradient(145deg,${iconColor(i)},${iconColor(i)}99)">${t[1]}</span><span><strong>${t[0]}</strong><small>${t[2]}</small></span>`;b.onclick=()=>openTool(t[3]);return b}
tools.forEach((t,i)=>$('allList').appendChild(makeTool(t,i)));
const THEME_KEY='multiCalcTheme';
function applyTheme(theme){document.body.classList.toggle('light',theme==='light');$('themeBtn').textContent=theme==='light'?'☾ Dark':'☼ Light';}
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
$('themeBtn').onclick=()=>{const next=document.body.classList.contains('light')?'dark':'light';localStorage.setItem(THEME_KEY,next);applyTheme(next);};
const HISTORY_KEY='multiCalcDailyHistory';
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getHistory(){let h;try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'null')}catch{};if(!h||h.date!==todayKey())h={date:todayKey(),items:[]};localStorage.setItem(HISTORY_KEY,JSON.stringify(h));return h;}
function addHistory(expression,result){const h=getHistory();h.items.unshift({expression:String(expression),result:String(result),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});h.items=h.items.slice(0,100);localStorage.setItem(HISTORY_KEY,JSON.stringify(h));}
function renderHistory(){const h=getHistory();$('historyDate').textContent=h.date;$('historyList').innerHTML=h.items.length?h.items.map(x=>`<div class="list-item" style="display:block;margin-bottom:8px"><div style="color:var(--muted);font-size:12px">${x.time}</div><div>${x.expression}</div><strong style="font-size:18px">${x.result}</strong></div>`).join(''):'<p class="notice">No calculations saved today yet.</p>';}
$('historyBtn').onclick=()=>{renderHistory();showPage('history');};$('historyHome').onclick=()=>showPage('home');
$('clearHistory').onclick=()=>{localStorage.setItem(HISTORY_KEY,JSON.stringify({date:todayKey(),items:[]}));renderHistory();};$('allBtn').onclick=()=>showPage('templates');

window.showPage = function(page){
  $('homePage').hidden=page!=='home';$('templatesPage').hidden=page!=='templates';
  $('toolPage').hidden=page!=='tool';$('historyPage').hidden=page!=='history';
  if(page==='templates' && typeof window.loadTemplateBanner==='function') window.loadTemplateBanner();
  if(page==='tool' && typeof window.loadToolBanner==='function') window.loadToolBanner();
  $('allBtn').style.display=page==='home'?'':'none';$('historyBtn').style.display=page==='home'?'':'none';
  if(window.Android&&typeof window.Android.setTemplateBannerVisible==='function'){
    window.Android.setTemplateBannerVisible(page==='templates'||page==='tool');
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function playKeyRipple(clicked){
  const keys=[...$('keys').querySelectorAll('.key')];
  const a=clicked.getBoundingClientRect(), cx=a.left+a.width/2, cy=a.top+a.height/2;
  const unit=Math.max(a.width,a.height);
  keys.forEach((k)=>{
    const r=k.getBoundingClientRect();
    const d=Math.hypot((r.left+r.width/2)-cx,(r.top+r.height/2)-cy);
    const hue=(190+d*1.15)%360;
    const wave=document.createElement('span');
    wave.className='key-ripple';
    wave.style.borderColor=`hsl(${hue},100%,68%)`;
    k.appendChild(wave);
    const delay=Math.round(d/unit*129);
    setTimeout(()=>{
      if(!wave.isConnected)return;
      wave.style.opacity='1';
      wave.style.boxShadow=`0 0 8px 2px hsla(${hue},100%,65%,.62)`;
      setTimeout(()=>{
        if(!wave.isConnected)return;
        wave.style.opacity='0';
        wave.style.boxShadow=`0 0 0 0 hsla(${hue},100%,65%,0)`;
        setTimeout(()=>wave.remove(),600);
      },350);
    },delay);
  });
}
$('keys').addEventListener('click',e=>{
 const clicked=e.target.closest('.key'); if(!clicked)return;
 playKeyRipple(clicked);
});

const field=(label,id,val,type='number',step='any')=>`<label class="field">${label}<input id="${id}" type="${type}" value="${val}" ${type==='number'?`step="${step}"`:''}></label>`;
const select=(label,id,opts)=>`<label class="field">${label}<select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label>`;
function form(body,button='Calculate'){return `<div class="form-grid">${body}</div><button class="primary" id="runTool">${button}</button><div id="out"></div>`}
function output(s){$('out').innerHTML=`<div class="output">${s}</div>`;const plain=s.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();if(plain)addHistory($('toolTitle').textContent,plain);}

   if(id==='unit') {setTimeout(()=>{const catSel=$('category');const refresh=()=>{const type=cats[catSel.value];['from','to'].forEach(k=>{const el=$(k),prev=el.value;el.innerHTML=type.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');if(type.some(o=>o[0]===prev))el.value=prev;});};catSel.addEventListener('change',refresh);refresh();},0)} break;

></div><hr><div><small>${$('zone').selectedOptions[0].textContent}</small><br><strong>${fmt(z)}</strong><br><span>${diffText} (${sign}${Math.floor(abs/60)}:${String(abs%60).padStart(2,'0')})</span></div>`};update();const sel=$('zone');sel.addEventListener('change',update);const timer=setInterval(()=>{if(!$('zoneClocks'))clearInterval(timer);else update()},1000)},0);break;

function num(id){let v=Number($(id)?.value);if(!Number.isFinite(v))throw Error('Please enter valid numbers.');return v}
function runTool(id){try{let r='';
switch(id){
case'bmi':{let bmi=num('w')/((num('h')/100)**2);r=`BMI result<br><strong>${bmi.toFixed(1)}</strong><br>${bmi<18.5?'Underweight':bmi<25?'Normal weight':bmi<30?'Overweight':'Obesity'}`;break}
case'age':{let b=new Date($('dob').value),e=new Date($('asof').value);if(isNaN(+b)||isNaN(+e)||e<b)throw Error('Choose valid dates.');let y=e.getFullYear()-b.getFullYear(),m=e.getMonth()-b.getMonth(),d=e.getDate()-b.getDate();if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}if(m<0){y--;m+=12}r=`Your age<br><strong>${y} years</strong><br>${m} months, ${d} days`;break}
case'loan':case'emi':{let p=num('amount'),rate=num('rate')/1200,n=num('years')*12,emi=rate? p*rate*Math.pow(1+rate,n)/(Math.pow(1+rate,n)-1):p/n;r=`Monthly payment<br><strong>${emi.toFixed(2)}</strong><br>Total payment: ${(emi*n).toFixed(2)} · Interest: ${(emi*n-p).toFixed(2)}`;break}
case'percent':r=`${num('p')}% of ${num('n')}<br><strong>${(num('p')*num('n')/100).toLocaleString()}</strong>`;break;
case'currency':{const rates=window.currencyRates||{USD:1,BDT:122,EUR:.92,GBP:.78,INR:83.5};const from=$('from').value,to=$('to').value;if(!rates[from]||!rates[to])throw Error('This currency rate is not available offline. Connect to the internet and try again.');let v=num('amount')/rates[from]*rates[to];r=`Converted amount<br><strong>${v.toLocaleString(undefined,{maximumFractionDigits:4})} ${to}</strong><br>Rate: 1 ${from} = ${(rates[to]/rates[from]).toLocaleString(undefined,{maximumFractionDigits:6})} ${to}<br>${window.currencyRateDate?'Rates date: '+window.currencyRateDate:'Offline fallback rate — connect to internet for updated rates'}`;break}
case'unit':case'length':case'weight':case'volume':case'temp':case'speed':{let v=num('val'),a=$('from').value,b=$('to').value,cat=id==='unit'?$('category').value:id;const factors={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254},weight:{kg:1,g:.001,mg:1e-6,lb:.45359237,oz:.028349523125,t:1000},volume:{l:1,ml:.001,m3:1000,cm3:.001,gal:3.785411784,qt:.946352946,cup:.2365882365},speed:{ms:1,kmh:1/3.6,mph:.44704,fts:.3048,knot:.514444}};let z;if(cat==='temp'){let c=a==='f'?(v-32)*5/9:a==='k'?v-273.15:v;z=b==='f'?c*9/5+32:b==='k'?c+273.15:c;}else{if(!(a in factors[cat])||!(b in factors[cat]))throw Error('Please select units from the same category.');z=v*factors[cat][a]/factors[cat][b]}const labels={m:'m',km:'km',cm:'cm',mm:'mm',mi:'mi',yd:'yd',ft:'ft',in:'in',kg:'kg',g:'g',mg:'mg',lb:'lb',oz:'oz',t:'t',l:'L',ml:'mL',m3:'m³',cm3:'cm³',gal:'US gal',qt:'US qt',cup:'US cup',c:'°C',f:'°F',k:'K',ms:'m/s',kmh:'km/h',mph:'mph',fts:'ft/s',knot:'kn'};r=`Converted value<br><strong>${z.toLocaleString(undefined,{maximumFractionDigits:8})}</strong> ${labels[b]}`;break}
case'discount':{let p=num('price'),d=num('discount');r=`Final price<br><strong>${(p*(1-d/100)).toFixed(2)}</strong><br>You save ${(p*d/100).toFixed(2)}`;break}
case'bmr':case'calorie':{let age=num('age'),w=num('weight'),h=num('height'),s=$('sex').value==='male'?5:-161,bmr=10*w+6.25*h-5*age+s;r=`Estimated daily calories<br><strong>${Math.round(id==='bmr'?bmr:bmr*1.45)} kcal</strong><br>${id==='bmr'?'Basal metabolic rate':'Estimated maintenance (light activity)'}`;break}
case'water':r=`Daily water estimate<br><strong>${(num('weight')*.035).toFixed(2)} liters</strong><br>Individual needs vary with activity and weather.`;break;
case'date':{let days=Math.abs(new Date($('end').value)-new Date($('start').value))/86400000;r=`Date difference<br><strong>${Math.round(days)} days</strong><br>${(days/7).toFixed(1)} weeks`;break}
case'time':{let m=num('hours')*60+num('minutes');r=`Total duration<br><strong>${Math.floor(m/60)}h ${m%60}m</strong><br>${m} minutes`;break}
case'gpa':{const gps=[...document.querySelectorAll('.gp')].map(x=>Number(x.value)),crs=[...document.querySelectorAll('.cr')].map(x=>Number(x.value));if(!gps.length||gps.some(x=>x<0||x>5)||crs.some(x=>!Number.isFinite(x)||x<=0))throw Error('Each grade point must be 0–5 and each credit must be greater than 0.');const total=crs.reduce((a,b)=>a+b,0),points=gps.reduce((sum,g,i)=>sum+g*crs[i],0),gpa=points/total;r=`Your GPA<br><strong>${gpa.toFixed(2)} / 5.00</strong><br>Total subjects: ${gps.length}<br>Total credits: ${total.toFixed(1)}<br>Total weighted grade points: ${points.toFixed(2)}`;break}
case'tax':{let p=num('price'),t=num('tax');r=`Price with tax<br><strong>${(p*(1+t/100)).toFixed(2)}</strong><br>Tax amount: ${(p*t/100).toFixed(2)}`;break}
case'savings':{let d=num('deposit'),n=num('years')*12,rate=num('rate')/1200,total=rate?d*(Math.pow(1+rate,n)-1)/rate:d*n;r=`Estimated savings<br><strong>${total.toLocaleString(undefined,{maximumFractionDigits:2})}</strong><br>Deposits: ${(d*n).toLocaleString()}`;break}
case'fuel':{let l=num('distance')*num('consumption')/100;r=`Estimated fuel cost<br><strong>${(l*num('fuelprice')).toFixed(2)}</strong><br>Fuel needed: ${l.toFixed(2)} L`;break}
case'ratio':{let a=num('a'),b=num('b'),g=(x,y)=>y?g(y,x%y):Math.abs(x);let d=g(a,b)||1;r=`Simplified ratio<br><strong>${a/d} : ${b/d}</strong>`;break}
case'average':{let arr=$('numbers').value.split(',').map(Number);if(!arr.length||arr.some(x=>!Number.isFinite(x)))throw Error('Enter comma-separated numbers.');r=`Average<br><strong>${(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(3)}</strong><br>${arr.length} numbers`;break}

case'area':r=`Rectangle area<br><strong>${(num('length')*num('width')).toLocaleString()} square units</strong>`;break;
case'electricity':r=`Estimated electricity cost<br><strong>${(num('usage')*num('rate')).toFixed(2)}</strong>`;break;
default:r=`Result<br><strong>${(num('n')+num('m')).toLocaleString()}</strong>`;
}output(r)}catch(e){output(`<span style="color:#ff7a7a">${e.message||'Please check your input.'}</span>`)}}

async function loadCurrencyRates(){
 const status=$('rateStatus');if(!status)return;const today=new Date().toISOString().slice(0,10);let cached=null;try{cached=JSON.parse(localStorage.getItem('multiCalcCurrencyRates')||'null')}catch{}
 if(cached?.date===today&&cached?.rates){window.currencyRates=cached.rates;window.currencyRateDate=cached.date;status.textContent=`Rates updated online: ${cached.date} · Cached for today`;return}
 if(cached?.rates){window.currencyRates=cached.rates;window.currencyRateDate=cached.date}
 try{const response=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});if(!response.ok)throw Error('Rate service unavailable');const data=await response.json();if(data.result!=='success'||!data.rates)throw Error('Invalid rate response');window.currencyRates=data.rates;window.currencyRateDate=data.time_last_update_utc?new Date(data.time_last_update_utc).toISOString().slice(0,10):today;localStorage.setItem('multiCalcCurrencyRates',JSON.stringify({date:today,rates:data.rates,sourceDate:window.currencyRateDate}));status.textContent=`Online rates loaded · Rate source date: ${window.currencyRateDate} · Next refresh after local date changes`;
 }catch(e){if(!window.currencyRates)window.currencyRates={USD:1,BDT:122,EUR:.92,GBP:.78,INR:83.5};status.textContent=window.currencyRateDate?`Internet unavailable; using saved rates from ${window.currencyRateDate}.`:'Internet unavailable; using approximate fallback rates. Connect to update.'}
}
