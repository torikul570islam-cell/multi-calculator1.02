name: Build Android APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
          cache-disabled: true

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "KEY_PASSWORD secret is missing"
            exit 1
          }

          echo "All required signing secrets are present."

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p app

          echo "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > app/release-keystore.jks

          test -s app/release-keystore.jks

          keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Release keystore restored and validated."

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon \
            --refresh-dependencies

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle assembleRelease --no-daemon

          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify Release APK signature
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          APKSIGNER="$(
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
              -type f \
              -name apksigner \
              2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in Android SDK build-tools."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
