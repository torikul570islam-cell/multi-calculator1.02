name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle Permission
        run: chmod +x gradlew

      - name: Verify Required GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "All required GitHub Secrets are present."

      - name: Restore and Validate Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          mkdir -p app

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > app/release-keystore.jks

          echo "Keystore file restored."
          echo "Keystore size: $(wc -c < app/release-keystore.jks) bytes"
          echo "Keystore SHA-256:"
          sha256sum app/release-keystore.jks

          echo "Checking keystore password..."

          if ! keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"; then
            echo "ERROR: Keystore password is incorrect, or the keystore is invalid."
            exit 1
          fi

          echo "Checking key alias..."

          if ! keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"; then
            echo "ERROR: KEY_ALIAS does not match the keystore."
            exit 1
          fi

          echo "Keystore and alias validated successfully."

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: farazi-calculator-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      - name: Verify Release APK Signature
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 -name '*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Checking APK signature..."

          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "WARNING: apksigner not found; signature verification skipped."
          fi

          echo "Release APK: $APK"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: farazi-calculator-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: rm -f app/release-keystore.jks
