name: Build Farazi Calculator APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Project Structure
        run: |
          set -e

          echo "Checking Android project files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure verified."

      - name: Check GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          }

          echo "All required secrets are present."

      - name: Restore and Validate Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          mkdir -p app

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > app/release-keystore.jks

          test -s app/release-keystore.jks

          echo "Keystore restored successfully."
          echo "Keystore file size:"
          wc -c < app/release-keystore.jks

          echo "Validating keystore password..."

          keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"

          echo "Validating key alias..."

          keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore validation successful."

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Farazi-Calculator-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          gradle assembleRelease \
            --no-daemon

      - name: Verify Release APK
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            find app/build/outputs -type f -name "*.apk"
            exit 1
          fi

          echo "Release APK generated successfully."
          ls -lh "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "APK signature verified."

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Farazi-Calculator-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f app/release-keystore.jks
