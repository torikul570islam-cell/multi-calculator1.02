name: Build Android APKs

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
          cache-disabled: true

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "FAILED: ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          }

          test -n "$KEYSTORE_PASSWORD" || {
            echo "FAILED: KEYSTORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "FAILED: KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "FAILED: KEY_PASSWORD secret is missing"
            exit 1
          }

          echo "SUCCESS: All four signing secrets are present."

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p app

          echo "STEP 1: Checking Base64 secret"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "FAILED: Base64 secret is empty"
            exit 1
          fi

          echo "STEP 2: Decoding keystore"

          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > app/release-keystore.jks; then
            echo "FAILED: Base64 decoding failed"
            exit 1
          fi

          echo "STEP 3: Checking keystore file"

          if [ ! -s app/release-keystore.jks ]; then
            echo "FAILED: Keystore file is empty"
            exit 1
          fi

          echo "STEP 4: Validating keystore"

          if keytool -list \
            -keystore app/release-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null 2>&1; then
            echo "SUCCESS: Keystore restored and validated."
          else
            echo "FAILED: Keystore or KEYSTORE_PASSWORD is invalid"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --refresh-dependencies

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify Release APK signature
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "FAILED: Release APK was not generated"
            exit 1
          fi

          APKSIGNER="$(
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
              -type f -name apksigner 2>/dev/null \
              | sort -V | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "FAILED: apksigner was not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

          echo "SUCCESS: Release APK signature verified."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
